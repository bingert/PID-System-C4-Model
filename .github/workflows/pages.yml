name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]          
  workflow_dispatch:          

jobs:
  # -------------------------------------------------
  # Validate the DSL (unchanged)
  # -------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    container: structurizr/cli   
    steps:
      #- uses: actions/checkout@v3
      - name: Show container info
        run: |
          echo "===== ls ====="
          ls 
          echo "===== ls /user/local ====="
          ls /usr/local/
          echo "===== OS ====="
          cat /etc/os-release
          echo "===== PATH ====="
          echo $PATH
          echo "===== Which structurizr.sh ====="
          which structurizr.sh || echo "not on PATH"
          echo "===== List possible locations ====="
          ls -l /usr/local/structurizr-cli 2>/dev/null || echo "folder missing"
          ls -l /usr/local/bin/structurizr.sh 2>/dev/null || echo "script missing"
      - name: Validate workspace
        working-directory: src
        run: |
          java -jar /usr/local/structurizr-cli/structurizr-cli.jar validate -w workspace.dsl
          
  # -------------------------------------------------
  # Generate the site **and** the diagram images
  # -------------------------------------------------
  pages:
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avisi-cloud/structurizr-site-generatr:latest
    steps:
      - uses: actions/checkout@v3

      # -----------------------------------------------------------------
      # Generate the static site (HTML, CSS, JS) – same as before
      # -----------------------------------------------------------------
      - name: Generate static site
        working-directory: src
        run: |
          /opt/structurizr-site-generatr/bin/structurizr-site-generatr generate-site \
            -w workspace.dsl -d main -o ${{ github.workspace }}/public

      # -----------------------------------------------------------------
      # Export the diagrams (PNG) – this is the missing piece
      # -----------------------------------------------------------------
      - name: Export diagrams (PNG)
        working-directory: src
        run: |
          # The CLI can export all diagrams as PNG files.
          # The `-format png` flag forces PNG output.
          /usr/local/structurizr-cli/structurizr.sh export -w workspace.dsl \
            -format png -output ${{ github.workspace }}/public/diagrams

      # -----------------------------------------------------------------
      # Verify that the images are really there (debug step)
      # -----------------------------------------------------------------
      - name: List generated files (debug)
        run: |
          echo "=== CONTENT OF public/ ==="
          ls -R ${{ github.workspace }}/public
          echo "=== CONTENT OF public/diagrams ==="
          ls -R ${{ github.workspace }}/public/diagrams || true

      # -----------------------------------------------------------------
      # Deploy to GitHub Pages
      # -----------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/public
          force_orphan: true   # creates a clean gh‑pages branch
