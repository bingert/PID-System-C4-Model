name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]          # same rule you had in GitLab
  workflow_dispatch:          # optional manual trigger

jobs:
  # -------------------------------------------------
  # 1️⃣ Validate the DSL (unchanged)
  # -------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    container:
      image: structurizr/cli   # same image you used in GitLab
    steps:
      - uses: actions/checkout@v3

      - name: Validate workspace
        working-directory: src
        run: |
          structurizr.sh validate -w workspace.dsl

  # -------------------------------------------------
  # 2️⃣ Generate the site **and** the diagram images
  # -------------------------------------------------
  pages:
    needs: [validate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avisi-cloud/structurizr-site-generatr:latest
    steps:
      - uses: actions/checkout@v3

      # -----------------------------------------------------------------
      # 2a️⃣ Generate the static site (HTML, CSS, JS) – same as before
      # -----------------------------------------------------------------
      - name: Generate static site
        working-directory: src
        run: |
          /opt/structurizr-site-generatr/bin/structurizr-site-generatr generate-site \
            -w workspace.dsl -d main -o ${{ github.workspace }}/public

      # -----------------------------------------------------------------
      # 2b️⃣ Export the diagrams (PNG) – this is the missing piece
      # -----------------------------------------------------------------
      - name: Export diagrams (PNG)
        working-directory: src
        run: |
          # The CLI can export all diagrams as PNG files.
          # The `-format png` flag forces PNG output.
          /usr/local/structurizr-cli/structurizr.sh export -w workspace.dsl \
            -format png -output ${{ github.workspace }}/public/diagrams

      # -----------------------------------------------------------------
      # 2c️⃣ Verify that the images are really there (debug step)
      # -----------------------------------------------------------------
      - name: List generated files (debug)
        run: |
          echo "=== CONTENT OF public/ ==="
          ls -R ${{ github.workspace }}/public
          echo "=== CONTENT OF public/diagrams ==="
          ls -R ${{ github.workspace }}/public/diagrams || true

      # -----------------------------------------------------------------
      # 3️⃣ Deploy to GitHub Pages
      # -----------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/public
          force_orphan: true   # creates a clean gh‑pages branch
