name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]          
  workflow_dispatch:          
permissions:
  contents: write      
  pages: write
  
jobs:
  # -------------------------------------------------
  # Validate the DSL
  # -------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: install structurizr
        run: |
          docker pull structurizr/structurizr
      - uses: actions/checkout@v3
      - name: Validate workspace
        working-directory: src
        run: |
          docker run --rm -v $PWD:/usr/local/structurizr \
            structurizr/structurizr validate -workspace workspace.dsl
  # -------------------------------------------------
  # Generate the site the diagram images
  # -------------------------------------------------
  pages:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: install structurizr-site-generatr
        run: |
          docker pull ghcr.io/avisi-cloud/structurizr-site-generatr
      - uses: actions/checkout@v3
      # -----------------------------------------------------------------
      # Generate the static site (HTML, CSS, JS) – same as before
      # -----------------------------------------------------------------
      - name: Generate static site
        working-directory: src
        run: |
          docker run --user root --rm -v .:/var/model \
            ghcr.io/avisi-cloud/structurizr-site-generatr generate-site \
            --workspace-file workspace.dsl
          cp -R ./build/site/* ${{ github.workspace }}/public/

      # -----------------------------------------------------------------
      # Export the diagrams (PNG) – this is the missing piece
      # -----------------------------------------------------------------
      #- name: Export diagrams (PNG)
      #  working-directory: src
      #  run: |
      #    mkdir -p ${{ github.workspace }}/public/diagrams
      #    # The CLI can export all diagrams as PNG files.
      #    # The `-format png` flag forces PNG output.
      #    docker run --rm -v $PWD:/usr/local/structurizr \
      #      structurizr/structurizr export -w workspace.dsl \
      #      -format png -output ${{ github.workspace }}/public/diagrams

      # -----------------------------------------------------------------
      # Deploy to GitHub Pages
      # -----------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/public
          force_orphan: true   # creates a clean gh‑pages branch
